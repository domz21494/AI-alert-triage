[project]
name = "alerttriage"
version = "0.1.0"
description = "AI security alert triage pipeline: Linux log ingestion, rule + ML detection, LLM triage, automated response."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
ml = ["scikit-learn>=1.5", "pandas>=2.2", "torch>=2.3", "mlflow>=2.14"]
api = ["fastapi>=0.111", "uvicorn>=0.30"]

[project.scripts]
alerttriage = "alerttriage.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
