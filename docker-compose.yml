services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: triage   # local dev only
      POSTGRES_DB: triage
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]
    profiles: ["llm"]   # start with: docker compose --profile llm up

volumes:
  pgdata:
  ollama:
