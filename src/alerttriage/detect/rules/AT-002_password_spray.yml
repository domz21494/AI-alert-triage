id: AT-002
title: Password spraying (many usernames from one IP)
description: One IP tries many different usernames - typical of spraying or user enumeration.
severity: high
mitre: {technique: T1110.003, name: "Brute Force: Password Spraying", tactic: Credential Access}
type: threshold
match: {event_type: [ssh_login_failed, ssh_invalid_user]}
group_by: src_ip
distinct: user
threshold: 5
window_seconds: 900
