id: AT-007
title: Password hash file accessed
description: Read or copy of /etc/shadow (password hashes).
severity: high
mitre: {technique: T1003.008, name: "OS Credential Dumping: /etc/passwd and /etc/shadow", tactic: Credential Access}
type: single
match:
  event_type: sudo_command
  command: {regex: '/etc/g?shadow|unshadow'}
